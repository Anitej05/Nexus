[project]
name = "nexus-workspace"
version = "0.1.0"
description = "NEXUS platform workspace"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/*"]

[dependency-groups]
dev = [
    "hypothesis",
    "httpx",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
    "testcontainers[neo4j,postgres,redis]",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"packages/contracts/tests/**/*.py" = ["S101"]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["nexus_contracts.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["apps", "packages"]

[tool.coverage.report]
fail_under = 85
