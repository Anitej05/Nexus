[project]
name = "nexus-security"
version = "0.1.0"
description = "Transactional tenant isolation primitives for NEXUS"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "nexus-contracts",
    "PyJWT[crypto]>=2.13.0",
    "rfc8785>=0.1.4",
    "sqlalchemy[asyncio]>=2.0.51",
    "uuid6>=2025.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
nexus-contracts = { workspace = true }
