name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_OPERATIONS_TEST_DATABASE_URL: postgresql+asyncpg://nexus_test:test_only_password@localhost:5432/nexus_test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv lock --check
      - run: uv sync --all-packages --frozen
      - run: node --version
      - run: npm ci --ignore-scripts
      - run: uv run python scripts/generate_contracts.py --check
      - run: uv run ruff check .
      - run: uv run mypy apps packages
      - run: uv run pytest packages/contracts/tests packages/prototype/tests tests/unit tests/contract tests/security -q
      - run: node --test apps/api/src/nexus_api/static/prototype/prototype.behavior.test.cjs
      - run: uv run python scripts/evaluate_academic.py --repetitions 5
      # Hosted Ubuntu 24.04 supplies Chromium's runtime libraries. Optional font
      # packages from apt mirrors are unnecessary for this English-language UI.
      - run: npx --no-install playwright install chromium
      - run: npm run test:academic-browser
      - run: npm run test:operations-ui
      - run: npm run test:operations-browser
      - name: Exercise full browser workflow against real PostgreSQL
        run: npm run test:operations-browser
        env:
          NEXUS_OPERATIONS_BROWSER_DATABASE_URL: postgresql+asyncpg://nexus_test:test_only_password@localhost:5432/postgres
      - run: uv run pip-audit
      - name: Scan complete reachable history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          docker.io/zricethezav/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          detect --source=/repo --no-banner --redact --verbose

  container-scan:
    name: Container scan when application images exist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        if: ${{ hashFiles('apps/api/Dockerfile') != '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: nexus-api:ci
      - name: Scan API image
        if: ${{ hashFiles('apps/api/Dockerfile') != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-api:ci
          scan-type: image
          # Block known HIGH or CRITICAL image vulnerabilities in CI.
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Build worker image
        if: ${{ hashFiles('apps/worker/Dockerfile') != '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/worker/Dockerfile
          load: true
          tags: nexus-worker:ci
      - name: Scan worker image
        if: ${{ hashFiles('apps/worker/Dockerfile') != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-worker:ci
          scan-type: image
          # Block known HIGH or CRITICAL image vulnerabilities in CI.
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
